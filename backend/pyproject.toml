[project]
name = "gold-mcp"
version = "0.1.0"
description = "XAUUSD chart, news collector and MCP server backed by MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.5120",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["goldcore", "api", "mcp_server"]
